<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kidney Disease Classification</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #e2e8f0; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
        .wrap { max-width: 640px; margin: 40px auto; padding: 0 16px; }
        h1 { text-align: center; font-weight: 600; }
        .card { background: var(--card); border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
        input[type=file] { width: 100%; margin: 12px 0; color: var(--text); }
        #preview { max-width: 100%; border-radius: 10px; margin: 12px 0; display: none; }
        button { background: var(--accent); color: #0f172a; border: 0; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; font-size: 16px; }
        button:disabled { opacity: .5; cursor: not-allowed; }
        #result { margin-top: 18px; text-align: center; font-size: 20px; min-height: 28px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Kidney CT Scan Classifier</h1>
        <div class="card">
            <input type="file" id="fileInput" accept="image/*" />
            <img id="preview" alt="preview" />
            <button id="predictBtn" disabled>Predict</button>
            <div id="result"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const predictBtn = document.getElementById("predictBtn");
        const result = document.getElementById("result");
        let base64Image = null;

        fileInput.addEventListener("change", () => {
            const file = fileInput.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                preview.style.display = "block";
                base64Image = e.target.result.split(",")[1];
                predictBtn.disabled = false;
                result.textContent = "";
            };
            reader.readAsDataURL(file);
        });

        predictBtn.addEventListener("click", async () => {
            if (!base64Image) return;
            predictBtn.disabled = true;
            result.textContent = "Predicting...";
            try {
                const res = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ image: base64Image }),
                });
                const data = await res.json();
                result.textContent = "Prediction: " + data[0].image;
            } catch (err) {
                result.textContent = "Error: " + err.message;
            } finally {
                predictBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
