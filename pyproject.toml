[project]
name = "kidney-disease-classification"
version = "0.1.0"
description = "End-to-end deep-learning pipeline for classifying kidney CT scans (VGG16 transfer learning) with DVC, MLflow and a Flask app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "tensorflow>=2.19.0",
    "numpy>=2.1.3",
    "pandas>=2.3.0",
    "scipy>=1.16.0",
    "matplotlib>=3.10.3",
    "seaborn>=0.13.2",
    "python-box>=7.3.2",
    "pyyaml>=6.0.2",
    "ensure>=1.0.4",
    "joblib>=1.5.1",
    "tqdm>=4.67.1",
    "gdown>=5.2.0",
    "dvc>=3.60.1",
    "mlflow>=3.1.1",
    "flask>=3.1.1",
    "flask-cors>=6.0.1",
]

[dependency-groups]
dev = [
    "notebook>=7.4.3",
    "pytest>=8.0.0",
    "types-pyyaml>=6.0.12.20250516",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
